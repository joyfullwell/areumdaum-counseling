<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADLER MIND · 부모 상황 대응 가이드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  :root{
    --bg: #FAF6F1;
    --bg-card: #FFFFFF;
    --ink: #362E2C;
    --ink-soft: #6E625D;
    --line: #E9E1D8;

    --c-burst: #E0876C;      /* 감정폭발 */
    --c-burst-soft: #F6E2DA;
    --c-separation: #6E9AA8; /* 분리·등원 */
    --c-separation-soft: #DEEAEC;
    --c-relation: #86A16A;   /* 관계 */
    --c-relation-soft: #E4EBDC;
    --c-habit: #CE9A34;      /* 생활습관 */
    --c-habit-soft: #F3E7CC;
    --c-trust: #93739B;      /* 신뢰 */
    --c-trust-soft: #EBE1EE;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 20px 80px;
  }

  .wrap{ max-width: 880px; margin: 0 auto; }

  /* Header */
  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: var(--c-separation);
    text-align: center;
    margin-bottom: 14px;
  }
  h1{
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 40px);
    text-align: center;
    line-height: 1.4;
    margin-bottom: 14px;
  }
  .lede{
    text-align: center;
    color: var(--ink-soft);
    font-size: 15.5px;
    line-height: 1.7;
    max-width: 460px;
    margin: 0 auto 36px;
  }

  /* Category filter */
  .filters{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 34px;
  }
  .filter-chip{
    border: 1px solid var(--line);
    background: var(--bg-card);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .filter-chip:hover{ border-color: var(--ink-soft); }
  .filter-chip.active{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  /* Grid */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
  }
  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px;
    cursor: pointer;
    text-align: left;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display:flex;
    flex-direction: column;
    gap: 14px;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 24px -14px rgba(54,46,44,0.25);
  }
  .card:focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  .icon-badge{
    width: 46px; height: 46px;
    border-radius: 13px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-badge svg{ width: 24px; height: 24px; }

  .card-cat{
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .card-title{
    font-family: 'Gowun Batang', serif;
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.4;
  }
  .card-sub{
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  /* category color assignment via data-cat, set in JS as inline vars */

  /* Detail overlay */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(54,46,44,0.42);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .2s ease;
    z-index: 50;
    padding: 0;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  @media (min-width: 720px){
    .overlay{ align-items:center; padding: 30px; }
  }

  .panel{
    background: var(--bg-card);
    width: 100%;
    max-width: 620px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 24px 24px 0 0;
    padding: 32px 28px 36px;
    transform: translateY(24px);
    transition: transform .25s ease;
  }
  .overlay.open .panel{ transform: translateY(0); }
  @media (min-width: 720px){
    .panel{ border-radius: 24px; }
  }

  .panel-top{
    display:flex; align-items:flex-start; justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .panel-close{
    border:none; background: var(--line); color: var(--ink);
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 16px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .panel-cat{
    font-size: 12px; font-weight: 600; letter-spacing: .04em; margin-bottom: 8px;
  }
  .panel-title{
    font-family: 'Gowun Batang', serif;
    font-size: 24px; font-weight: 700; line-height: 1.4;
  }
  .panel-sub{
    color: var(--ink-soft); font-size: 14.5px; margin-top: 6px; line-height: 1.6;
  }

  .section-label{
    font-size: 12.5px; font-weight: 700; letter-spacing: .03em;
    color: var(--ink-soft);
    margin: 26px 0 10px;
  }
  .understanding{
    font-size: 14.5px; line-height: 1.75; color: var(--ink);
    background: var(--bg);
    border-left: 3px solid var(--line);
    padding: 14px 16px;
    border-radius: 4px;
  }
  .script-list{ display:flex; flex-direction: column; gap: 10px; }
  .script-line{
    font-family: 'Gowun Batang', serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--bg);
    position: relative;
  }
  .script-line::before{
    content: '“';
    font-family: 'Gowun Batang', serif;
    opacity: .35;
    margin-right: 2px;
  }
  .script-line::after{
    content: '”';
    font-family: 'Gowun Batang', serif;
    opacity: .35;
  }
  .tip{
    font-size: 14px; line-height: 1.75; color: var(--ink-soft);
  }

  .theory-badge{
    display:inline-flex; align-items:center; gap:6px;
    margin-top: 22px;
    font-size: 12px; font-weight:600; color: var(--ink-soft);
    background: var(--bg); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 999px;
    cursor:pointer; user-select:none;
  }
  .theory-badge:hover{ border-color: var(--ink-soft); }
  .theory-badge .chevron{ display:inline-block; transition: transform .2s ease; font-size:9px; }
  .theory-badge.open .chevron{ transform: rotate(180deg); }

  .theory-panel{
    max-height:0; overflow:hidden; opacity:0;
    transition: max-height .25s ease, opacity .2s ease, margin .2s ease;
  }
  .theory-panel.open{ max-height: 260px; opacity:1; margin-top:10px; }
  .theory-quote{
    font-size: 12.5px; font-style: italic; line-height:1.6; color:var(--ink-soft);
    border-left: 2px solid var(--line); padding-left:10px; margin-bottom:8px;
  }
  .theory-translation{ font-size:13.5px; line-height:1.65; color:var(--ink); margin-bottom:8px; }
  .theory-source{ font-size:11px; color:var(--ink-soft); opacity:.75; }

  /* CTA */
  .cta{
    margin-top: 56px;
    background: var(--ink);
    color: #fff;
    border-radius: 22px;
    padding: 38px 30px;
    text-align: center;
  }
  .cta-eyebrow{
    font-size: 12.5px; letter-spacing: .1em; opacity: .65; margin-bottom: 10px;
  }
  .cta h2{
    font-family: 'Gowun Batang', serif;
    font-size: 22px; line-height: 1.5; margin-bottom: 12px;
  }
  .cta p{
    font-size: 14px; line-height: 1.7; opacity: .82; max-width: 420px; margin: 0 auto 22px;
  }
  .cta a{
    display:inline-block;
    background: #fff; color: var(--ink);
    font-weight: 600; font-size: 14.5px;
    padding: 12px 26px; border-radius: 999px;
    text-decoration: none;
  }

  .footnote{
    text-align:center; font-size: 12px; color: var(--ink-soft); opacity:.7;
    margin-top: 22px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">ADLER MIND · 부모 상황 대응 가이드</div>
  <h1>지금, 어떤 순간이신가요?</h1>
  <p class="lede">겪고 있는 상황을 하나 골라보세요.<br>지금 이 순간 아이에게 건넬 수 있는 말을 알려드릴게요.</p>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>

  <div class="cta">
    <div class="cta-eyebrow">이 스크립트로도 풀리지 않는 마음이 있다면</div>
    <h2>혼자 애쓰지 않으셔도 돼요</h2>
    <p>같은 상황이라도 아이마다, 가정마다 다른 이야기가 있어요. 1:1 부모상담에서 지금 겪고 계신 상황을 더 깊이 들여다봐 드릴게요.</p>
    <a href="https://areumdaummind.co.kr" target="_blank" rel="noopener">상담 문의하기</a>
  </div>

  <div class="footnote">아름다운심리상담연구소 · ADLER MIND</div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

/* ============================================================
   렌더링
   ============================================================ */

const grid = document.getElementById('grid');
const filters = document.getElementById('filters');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

let activeFilter = 'all';

function renderFilters(){
  const all = [{key:'all', label:'전체'}, ...Object.entries(categories).map(([key,c]) => ({key, label:c.label}))];
  filters.innerHTML = all.map(f => `
    <button class="filter-chip ${f.key === activeFilter ? 'active' : ''}" data-key="${f.key}">${f.label}</button>
  `).join('');
  filters.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.key;
      renderFilters();
      renderGrid();
    });
  });
}

function renderGrid(){
  const list = activeFilter === 'all' ? situations : situations.filter(s => s.category === activeFilter);
  grid.innerHTML = list.map(s => {
    const cat = categories[s.category];
    return `
      <button class="card" data-id="${s.id}" style="--cat-color:${cat.color}">
        <div class="icon-badge" style="background:${cat.soft}; color:${cat.color}">${icons[s.icon]}</div>
        <div>
          <div class="card-cat" style="color:${cat.color}">${cat.label}</div>
          <div class="card-title">${s.title}</div>
        </div>
        <div class="card-sub">${s.subtitle}</div>
      </button>
    `;
  }).join('');
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
  });
}

function openDetail(id){
  const s = situations.find(x => x.id === id);
  const cat = categories[s.category];
  const th = theories[s.theory];
  panel.innerHTML = `
    <div class="panel-top">
      <div>
        <div class="panel-cat" style="color:${cat.color}">${cat.label}</div>
        <div class="panel-title">${s.title}</div>
        <div class="panel-sub">${s.subtitle}</div>
      </div>
      <button class="panel-close" aria-label="닫기">✕</button>
    </div>

    <div class="section-label">아이 마음 이해하기</div>
    <div class="understanding">${s.understanding}</div>

    <div class="section-label">지금 이렇게 말해보세요</div>
    <div class="script-list">
      ${s.script.map(line => `<div class="script-line">${line}</div>`).join('')}
    </div>

    <div class="section-label">그다음엔 이렇게 해보세요</div>
    <div class="tip">${s.tip}</div>

    ${th ? `
    <div class="theory-badge" id="theoryToggle">
      <span>${th.name}</span>
      <span class="chevron">▾</span>
    </div>
    <div class="theory-panel" id="theoryPanel">
      ${th.quote ? `<div class="theory-quote">"${th.quote}"</div>` : ''}
      <div class="theory-translation">${th.translation}</div>
      <div class="theory-source">출처: ${th.source}</div>
    </div>
    ` : ''}
  `;
  panel.querySelector('.panel-close').addEventListener('click', closeDetail);
  const badge = panel.querySelector('#theoryToggle');
  if(badge){
    badge.addEventListener('click', () => {
      badge.classList.toggle('open');
      panel.querySelector('#theoryPanel').classList.toggle('open');
    });
  }
  overlay.classList.add('open');
}

function closeDetail(){
  overlay.classList.remove('open');
}

overlay.addEventListener('click', (e) => {
  if(e.target === overlay) closeDetail();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeDetail();
});

renderFilters();
renderGrid();
</script>
